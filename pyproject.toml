[project]
name = "creative-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mega61", email = "megauploads61@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.30.1",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
]

[project.scripts]
creative-bot = "creative_bot:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
# Real-ESRGAN upscaling (GPU if available, else CPU). Without it the final step uses Lanczos.
upscale = ["torch>=2.9", "torchvision", "spandrel>=0.4", "numpy>=2"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

# CUDA 12.6 builds: the newest line that still ships Pascal kernels (sm_60, runs on the
# server's GTX 1060). cu128+ dropped Pascal. Without a GPU the same build runs on CPU.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
