# Production stack — `creative-bot` in Portainer, deployed from Git (Repository mode,
# compose path `deploy/stack.yml`, automatic updates by polling).
#
# The `image:` line below is rewritten by CI with the digest of every build
# (.github/workflows/image.yml); `git revert` of a deploy commit rolls back exactly.
# Everything else is a Portainer stack env var and never goes in the repo:
#
#   GEMINI_API_KEY     TELEGRAM_TOKEN
#   ALLOWED_USER_IDS   e.g. 111111111,222222222
#   CHAT_BRANDS        e.g. -1001111111111:golden,-1002222222222:cassis
#
# Outbound traffic only (Telegram long polling + Gemini API): no ports, networks or Caddy.
# State is plain files in the `creative_bot_data` volume; there is no database.

name: creative-bot

volumes:
  creative_bot_data:

services:
  bot:
    image: ghcr.io/mega61/creative-bot@sha256:b7096b85620846a6ce20d0839482caf475a026c763c8be2f51b596ace0482b5d
    container_name: creative-bot
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS}
      CHAT_BRANDS: ${CHAT_BRANDS}
      IMAGE_MODEL: ${IMAGE_MODEL:-gemini-nano-banana-2.1}
      TEXT_MODEL: ${TEXT_MODEL:-gemini-3.8-flash}
      DRAFT_SIZE: ${DRAFT_SIZE:-2K}
      # PyTorch sizes its thread pool from the host's core count, not the container's CPU cap;
      # without this it oversubscribes the 4 CPUs and runs slower.
      OMP_NUM_THREADS: ${CPU_LIMIT:-4}
    volumes:
      - creative_bot_data:/data
    # Only the final upscale is heavy: measured ~3 min, ~11 CPU-min and 1.8 GB peak RAM for
    # a 2K post on 4 cores. Rounds themselves run on Google's side and cost ~nothing here.
    cpus: ${CPU_LIMIT:-4}
    mem_limit: 3g
